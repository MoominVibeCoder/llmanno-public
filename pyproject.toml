[project]
name = "llmanno"
version = "0.1.0"
description = "Deduktive LLM-Annotation mit Codebuch, Modell-Panel und Validierung gegen menschliches Gold"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.7",
    "pyreadr>=0.5.7",
    "pyreadstat>=1.3.6",
    "PySide6-Essentials>=6.8",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
]

[project.gui-scripts]
llmanno = "llmanno.gui.app:main"

[project.scripts]
llmanno-rerun = "llmanno.rerun:main"

[project.optional-dependencies]
harness = [
    "anthropic>=2.3.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
